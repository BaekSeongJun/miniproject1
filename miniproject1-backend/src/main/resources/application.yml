spring:
  application:
    name: miniproject1-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pharmaprice}
    username: ${POSTGRES_USER:pharmaprice}
    password: ${POSTGRES_PASSWORD:qwe123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

jwt:
  # 프로덕션에서는 반드시 JWT_SECRET 환경변수로 덮어쓴다 (최소 32바이트).
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-minimum-32-bytes}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

recommendation:
  weights:
    price: 0.60
    distance: 0.25
    freshness: 0.15
  freshness-half-life-days: 30
  price-window-days: 90
  price-window-fallback-days: 180
  outlier:
    iqr-multiplier: 1.5
    min-samples: 4
